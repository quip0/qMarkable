# qMarkable tracker settings (/home/root/.config/qmarkable/tracker.conf)
# Restart the tracker after editing:  systemctl restart qmarkable-tracker

# While a notebook session is running, save progress this often (seconds).
# Sessions are also saved the moment they end.
checkpoint=300

# Timezone override. Leave empty to follow the tablet's system timezone
# (/etc/localtime), which the tracker re-checks automatically.
# Examples: tz=Europe/Berlin   tz=America/New_York
tz=
